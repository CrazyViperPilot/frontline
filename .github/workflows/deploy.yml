# Lädt das Spiel per FTP auf Daniels Webspace (${SITE_URL}), sobald die Tests auf main grün sind.
# Von Hand: Actions → Deploy → Run workflow (lädt ohne Test-Abwarten hoch).
#
# Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USER, FTP_PASSWORD   Zugang zum Webspace
#   DB_SERVER, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD   MySQL für api/save.php und api/auth.php (Pflicht; sonst Abbruch)
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_FROM   Postfach für die Konto-Mails (Bestätigung, Passwort vergessen).
#     Fehlen sie, gibt es nur eine Warnung; die API meldet dann beim Mailversand „E-Mail-Versand … nicht eingerichtet“.
#     Port 465 = TLS von Anfang an, sonst STARTTLS (z. B. 587). MAIL_FROM z. B. „Frontline <spiel@beispiel.de>“.
#   ADMIN_USER, ADMIN_PASSWORD   Zugang zum Admin-Panel (/frontline/admin/, api/admin.php). Der Deploy schreibt nur den
#     Benutzernamen und den Hash des Passworts (password_hash) in api/config.php, nie das Passwort selbst. Fehlen sie, gibt es
#     nur eine Warnung; die Admin-API antwortet dann mit 503 „Admin nicht eingerichtet“. Das Passwort höchstens 72 Byte.
# Optionale Variablen (gleiche Seite, Reiter „Variables“):
#   FTP_DIR       Zielordner relativ zum FTP-Login, mit Schrägstrich am Ende (Standard ./ = Startordner des Logins)
#   FTP_PROTOCOL  ftps (Standard) oder ftp
#   FTP_SECURITY  strict (Standard) oder loose, wenn das FTPS-Zertifikat nicht zum Hostnamen passt
name: Deploy

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://phpexpert.de/frontline/' }}

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Secrets prüfen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for v in FTP_SERVER FTP_USER FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v fehlt (Settings → Secrets and variables → Actions)."; exit 1; fi
          done

      - uses: actions/checkout@v4
        with:
          # beim Auslösen durch den Testlauf genau den getesteten Stand hochladen
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Datenbank- und Mail-Zugang für api/save.php und api/auth.php. Werte per PHP var_export gequotet, nicht per Shell-Interpolation.
      # Die SMTP-Werte sind optional: fehlen sie, nur eine Warnung (die Konto-Mails melden dann einen Fehler).
      - name: Datenbank- und Mail-Zugang schreiben (api/config.php)
        env:
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          for v in DB_SERVER DB_PORT DB_NAME DB_USER DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v fehlt (Settings → Secrets and variables → Actions)."; exit 1; fi
          done
          if ! [[ "$DB_PORT" =~ ^[0-9]+$ ]]; then echo "::error::Secret DB_PORT ist keine Zahl."; exit 1; fi
          missing=""
          for v in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD MAIL_FROM; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Secrets fehlen für den Konto-Mailversand:$missing. Bestätigung und Passwort vergessen gehen nicht raus (die API meldet das)."
          elif ! [[ "$SMTP_PORT" =~ ^[0-9]+$ ]]; then
            echo "::warning::Secret SMTP_PORT ist keine Zahl: Mailversand nicht eingerichtet."
          fi
          if [ -z "$ADMIN_USER" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::warning::Secrets ADMIN_USER oder ADMIN_PASSWORD fehlen: das Admin-Panel antwortet mit „Admin nicht eingerichtet“."
          fi
          php -r '
            // Admin-Zugang: nur Name und Hash; das Passwort selbst geht nicht in die Datei. bcrypt liest höchstens 72 Byte.
            $adminPass = (string) getenv("ADMIN_PASSWORD");
            if (strlen($adminPass) > 72) { fwrite(STDERR, "ADMIN_PASSWORD ist länger als 72 Byte\n"); exit(1); }
            $c = ["host" => getenv("DB_SERVER"), "port" => (int) getenv("DB_PORT"), "name" => getenv("DB_NAME"),
                  "user" => getenv("DB_USER"), "password" => getenv("DB_PASSWORD"),
                  "smtp_host" => (string) getenv("SMTP_HOST"), "smtp_port" => (int) getenv("SMTP_PORT"),
                  "smtp_user" => (string) getenv("SMTP_USER"), "smtp_password" => (string) getenv("SMTP_PASSWORD"),
                  "mail_from" => (string) getenv("MAIL_FROM"),
                  "admin_user" => trim((string) getenv("ADMIN_USER")),
                  "admin_pass_hash" => $adminPass !== "" ? password_hash($adminPass, PASSWORD_DEFAULT) : ""];
            $src = "<?php\n// Vom Deploy (.github/workflows/deploy.yml) aus den Secrets DB_* geschrieben. Nicht im Repo.\nreturn " . var_export($c, true) . ";\n";
            @mkdir("secret");
            if (file_put_contents("secret/config.php", $src) === false) { fwrite(STDERR, "secret/config.php nicht schreibbar\n"); exit(1); }
          '
          php -l secret/config.php

      # lftp statt einer Node-FTP-Action: kommt mit FTPS-Servern zurecht, die TLS-Session-Reuse auf der Datenverbindung verlangen.
      - name: Hochladen per FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || './' }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_SECURITY: ${{ vars.FTP_SECURITY || 'strict' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          # Nur, was der Browser braucht, plus das Spielstand-Backend api/ und das Admin-Panel admin/ (nicht im Offline-Cache).
          # Kein --delete: api/data/ (Spielstände) bleibt unberührt.
          mkdir site
          cp -r index.html editor.html manifest.json sw.js css js icons api admin site/
          ssl=$([ "$FTP_PROTOCOL" = "ftp" ] && echo false || echo true)
          verify=$([ "$FTP_SECURITY" = "loose" ] && echo no || echo yes)
          lftp --env-password -u "$FTP_USER" "$FTP_SERVER" <<LFTP
          set ftp:ssl-force $ssl
          set ftp:ssl-protect-data $ssl
          set ssl:verify-certificate $verify
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          mkdir -p -f $FTP_DIR
          mirror --reverse --no-perms --verbose site/ $FTP_DIR
          bye
          LFTP

      # Der Datenbank-Zugang geht erst hoch, wenn der Webspace PHP wirklich ausführt: sonst läge das Passwort lesbar im Netz.
      - name: PHP prüfen, dann Datenbank-Zugang hochladen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || './' }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_SECURITY: ${{ vars.FTP_SECURITY || 'strict' }}
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' ${SITE_URL})
          echo "Startseite: HTTP $code"
          [ "$code" = "200" ] || echo "::warning::${SITE_URL} antwortet mit HTTP $code (Zielordner FTP_DIR prüfen)."
          head=$(curl -s ${SITE_URL}api/save.php | head -c 200 || true)
          echo "Spielstand-API (Anfang): $head"
          case "$head" in
            *"<?php"*|"")
              echo "::error::Der Webspace führt PHP unter ${SITE_URL} nicht aus (save.php kommt als Quelltext oder gar nicht). PHP für die Domain im Kundenbereich einschalten; der Datenbank-Zugang wurde NICHT hochgeladen."
              exit 1 ;;
          esac
          ssl=$([ "$FTP_PROTOCOL" = "ftp" ] && echo false || echo true)
          verify=$([ "$FTP_SECURITY" = "loose" ] && echo no || echo yes)
          lftp --env-password -u "$FTP_USER" "$FTP_SERVER" <<LFTP
          set ftp:ssl-force $ssl
          set ftp:ssl-protect-data $ssl
          set ssl:verify-certificate $verify
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          put secret/config.php -o ${FTP_DIR}api/config.php
          bye
          LFTP
          sleep 2
          echo "Spielstand-API: $(curl -s ${SITE_URL}api/save.php | head -c 300)"
          leak=$(curl -s ${SITE_URL}api/config.php | head -c 100)
          case "$leak" in *password*) echo "::error::api/config.php ist lesbar!"; exit 1 ;; esac
