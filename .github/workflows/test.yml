# Tests für Frontline: bei jedem Push und Pull Request (Tests und KI-Kennzahlen).
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # KI-Kennzahlen (tools/metrics.mjs): lange Läufe KI gegen KI, warnt bei groben Ausreißern gegenüber tools/metrics-ref.json
      - run: npm run metrics
